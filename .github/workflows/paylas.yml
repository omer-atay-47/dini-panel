name: Elle paylaşım (yedek)

# Günlük zamanlama kapalı: paylaşımlar Meta Business Suite'ten planlanıyor (bkz. otomasyon/KURULUM.md).
on:
  workflow_dispatch:        # yalnızca elle çalışır (Actions sekmesi > Run workflow)
    inputs:
      dry_run:
        description: "1 yazarsan paylaşmadan dener"
        default: "1"

permissions:
  contents: write

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Videoyu paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == '1' && '1' || '0' }}
        run: python3 otomasyon/post.py
      - name: Paylaşım kaydını kaydet
        run: |
          git config user.name "paylasim-botu"
          git config user.email "bot@users.noreply.github.com"
          git add otomasyon/posted.json
          git diff --cached --quiet || (git commit -m "Paylaşıldı: kayıt güncellendi" && git push)
